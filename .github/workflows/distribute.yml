name: Distribute Articles

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: blog-project-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run safety regression tests
        run: npm test

      - name: Type-check TypeScript
        run: npm run typecheck

      - name: Load previous article manifest
        id: previous_manifest
        shell: bash
        env:
          BASELINE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || format('{0}^', github.sha) }}
        run: |
          node scripts/resolve_manifest_history.ts \
            --baseline-ref "$BASELINE_REF" \
            --output "$RUNNER_TEMP/previous-articles-manifest.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate Qiita and Zenn source sets before writes
        env:
          PREVIOUS_MANIFEST_PATH: ${{ steps.previous_manifest.outputs.path }}
        shell: bash
        run: |
          if [[ -n "$PREVIOUS_MANIFEST_PATH" ]]; then
            npm run validate:articles -- \
              "--previous-manifest=$PREVIOUS_MANIFEST_PATH"
          else
            npm run validate:articles
          fi

      - name: Update local_updated_at in articles
        run: |
          node scripts/update_metadata.ts articles/share

      - name: Validate distributable metadata
        run: npm run validate:articles:distribution

      - name: Upload prepared distribution snapshot
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: prepared-articles-${{ github.run_id }}
          path: |
            articles/manifest.json
            articles/share
            articles/qiita
            articles/zenn
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 1

  prepare_targets:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: distribute
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: qiita
            repository: SolitudeRA/qiita-repo
          - target: zenn
            repository: SolitudeRA/zenn-repo

    steps:
      - name: Checkout Blog-Project automation
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          package-manager-cache: false

      - name: Download prepared distribution snapshot
        uses: actions/download-artifact@v8
        with:
          name: prepared-articles-${{ github.run_id }}
          path: prepared-articles

      - name: Restore required empty snapshot directories
        run: mkdir -p prepared-articles/share

      - name: Checkout target main
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          ref: main
          fetch-depth: 0
          persist-credentials: false
          path: target-repository

      - name: Prepare target automation branch
        run: |
          npm run distribute:target -- prepare \
            --target "${{ matrix.target }}" \
            --source-root prepared-articles \
            --repository-root target-repository

      - name: Generate Zenn outputs inside the proposed change
        if: matrix.target == 'zenn'
        working-directory: target-repository
        run: |
          npm ci
          npm run build:articles -- --base-ref=HEAD
          npm run check:articles -- --base-ref=HEAD
          npx --no-install zenn list:articles

      - name: Export prepared target patch
        run: |
          npm run distribute:target -- export \
            --target "${{ matrix.target }}" \
            --repository-root target-repository \
            --output "$RUNNER_TEMP/prepared-target.json"

      - name: Upload prepared target patch
        uses: actions/upload-artifact@v7
        with:
          name: prepared-target-${{ matrix.target }}-${{ github.run_id }}
          path: ${{ runner.temp }}/prepared-target.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  publish_targets:
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.distribute.result == 'success' }}
    needs:
      - distribute
      - prepare_targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: qiita
            repository: SolitudeRA/qiita-repo
          - target: zenn
            repository: SolitudeRA/zenn-repo

    steps:
      - name: Checkout Blog-Project automation
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          package-manager-cache: false

      - name: Download prepared target patch
        uses: actions/download-artifact@v8
        with:
          name: prepared-target-${{ matrix.target }}-${{ github.run_id }}
          path: prepared-target

      - name: Checkout fresh target main
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          ref: main
          fetch-depth: 0
          persist-credentials: false
          path: target-repository

      - name: Apply prepared target patch
        run: |
          npm run distribute:target -- apply \
            --target "${{ matrix.target }}" \
            --repository-root target-repository \
            --patch-file prepared-target/prepared-target.json

      - name: Resolve deterministic source timestamp
        id: source
        shell: bash
        run: echo "timestamp=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Publish checked automation pull request
        env:
          DISTRIBUTION_SOURCE_TIMESTAMP: ${{ steps.source.outputs.timestamp }}
          GH_TOKEN: ${{ secrets.BLOG_PROJECT_TOKEN }}
        run: |
          npm run distribute:target -- publish \
            --target "${{ matrix.target }}" \
            --repository-root target-repository
